<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FMM pooled chain starts</title>
<!--
  DECK TEMPLATE for `visualize` slides mode.
  HARD RULES: each content slide is ONE diagram that fully describes that part of the
  architecture/flow. ≤3 short lines of text per slide — a 3–5 word title + maybe one caption +
  node labels. NO prose bullets, NO paragraphs. Gazable in ~2s. Open on the core fast (≤1 ramp slide).
  Pull the diagram from references/primitives.html. Nav (←/→/space/scroll/swipe + dots + bar) is wired.
-->
<style>
  :root{
    --bg:#0d1117;--panel:#141b24;--line:#2a313c;--ink:#e6edf3;--mut:#9aa7b4;--dim:#6b7785;
    --acc:#e06b3b;--acc2:#f0a868;--good:#3fb950;--bad:#e5534b;--blue:#4493f8;
    --mono:'SF Mono',ui-monospace,Menlo,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,'Segoe UI',Inter,sans-serif;-webkit-font-smoothing:antialiased}
  .deck{height:100vh;overflow-y:scroll;scroll-snap-type:y mandatory;scroll-behavior:smooth}
  .slide{min-height:100vh;scroll-snap-align:start;display:flex;flex-direction:column;justify-content:center;align-items:center;
    padding:6vh 7vw;position:relative;text-align:center;
    background:radial-gradient(900px 600px at 75% -10%,#1a2330 0%,var(--bg) 60%);
    opacity:0;transform:translateY(20px);transition:opacity .55s ease,transform .55s ease}
  .slide.visible{opacity:1;transform:none}
  .slide:nth-child(even){background:radial-gradient(900px 600px at 20% 110%,#191f2b 0%,var(--bg) 60%)}
  /* text budget: title + one caption, that's it */
  .label{font:600 13px/1 var(--mono);letter-spacing:.2em;text-transform:uppercase;color:var(--acc2);margin-bottom:18px}
  .title{font-size:clamp(26px,3.6vw,46px);line-height:1.1;margin:0 0 26px;letter-spacing:-.01em;font-weight:700;max-width:18ch}
  .title .hl{background:linear-gradient(110deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent}
  .cap{margin-top:22px;color:var(--dim);font-size:clamp(13px,1.3vw,16px);max-width:46ch}
  .cap code{font-family:var(--mono);font-size:.9em;color:var(--acc2);background:#10151c;border:1px solid var(--line);padding:1px 5px;border-radius:5px}
  /* the diagram owns the slide */
  .figure{width:100%;max-width:920px;display:flex;justify-content:center}
  svg{max-width:100%;height:auto;overflow:visible}
  .t{fill:var(--ink);font-family:-apple-system,Inter,sans-serif}.tm{fill:var(--mut)}.td{fill:var(--dim)}.ta{fill:var(--acc2)}.tg{fill:var(--good)}
  .lbl{font:600 11px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase}
  /* title slide only: allow a big headline */
  .hero .title{font-size:clamp(40px,7vw,92px);max-width:14ch}
  /* nav chrome */
  .deck-progress{position:fixed;top:0;left:0;height:3px;width:0;background:linear-gradient(90deg,var(--acc),var(--acc2));z-index:50;transition:width .4s ease}
  .deck-dots{position:fixed;right:24px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:11px;z-index:50}
  .deck-dot{width:9px;height:9px;border-radius:50%;border:none;padding:0;cursor:pointer;background:#3a4351;transition:transform .2s,background .2s}
  .deck-dot.active{background:var(--acc);transform:scale(1.45)}
  .deck-counter{position:fixed;left:24px;bottom:20px;font:600 13px/1 var(--mono);color:var(--dim);z-index:50}
  .deck-hints{position:fixed;right:24px;bottom:20px;font:13px/1 var(--mono);color:var(--dim);z-index:50;transition:opacity .6s}
  .deck-hints.faded{opacity:0}
  @media(max-width:760px){.deck-dots{display:none}}
  @media(prefers-reduced-motion:reduce){.slide{transition:none;opacity:1;transform:none}.deck{scroll-behavior:auto}}
</style>
<style>.title{max-width:32ch}.cap{max-width:78ch;color:#9aa7b4}.eq{font-family:var(--mono);font-size:18px}.figure{max-width:920px}</style></head>
<body>
<div class="deck"><section class="slide"><h2 class="title">Merge paid computation chains</h2><div class="figure"><svg viewBox="0 0 920 360" width="920" aria-label="Two selected donor chains share t=a+b. Importing their ancestors with exact reuse gives a three-gate partial circuit."><defs><marker id="s1arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#e06b3b"/></marker><marker id="s1blue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#4493f8"/></marker><marker id="s1merge" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#6b7785"/></marker></defs><rect x="10" y="25" width="390" height="270" rx="12" fill="none" stroke="#2a313c"/><rect x="520" y="25" width="390" height="270" rx="12" fill="none" stroke="#2a313c"/><g transform="translate(30,50)"><rect width="150" height="64" rx="10" fill="#10151c" stroke="#e06b3b" stroke-width="2"/><text x="75.0" y="38.0" text-anchor="middle" class="t eq">t=a+b</text></g><g transform="translate(30,205)"><rect width="150" height="64" rx="10" fill="#10151c" stroke="#e06b3b" stroke-width="2"/><text x="75.0" y="38.0" text-anchor="middle" class="t eq">p=t+c</text></g><g transform="translate(220,50)"><rect width="150" height="64" rx="10" fill="#10151c" stroke="#4493f8" stroke-width="2"/><text x="75.0" y="38.0" text-anchor="middle" class="t eq">t=a+b</text></g><g transform="translate(220,205)"><rect width="150" height="64" rx="10" fill="#10151c" stroke="#4493f8" stroke-width="2"/><text x="75.0" y="38.0" text-anchor="middle" class="t eq">q=t−d</text></g><path d="M105,114 L105,205" fill="none" stroke="#e06b3b" stroke-width="2" marker-end="url(#s1arr)"/><path d="M295,114 L295,205" fill="none" stroke="#4493f8" stroke-width="2" marker-end="url(#s1blue)"/><path d="M400,160 L520,160" fill="none" stroke="#6b7785" stroke-width="2" marker-end="url(#s1merge)"/><g transform="translate(640,50)"><rect width="150" height="64" rx="10" fill="#10151c" stroke="#9aa7b4" stroke-width="2"/><text x="75.0" y="38.0" text-anchor="middle" class="t eq">t=a+b</text></g><g transform="translate(545,205)"><rect width="150" height="64" rx="10" fill="#10151c" stroke="#e06b3b" stroke-width="2"/><text x="75.0" y="38.0" text-anchor="middle" class="t eq">p=t+c</text></g><g transform="translate(735,205)"><rect width="150" height="64" rx="10" fill="#10151c" stroke="#4493f8" stroke-width="2"/><text x="75.0" y="38.0" text-anchor="middle" class="t eq">q=t−d</text></g><path d="M715,114 L715,157" fill="none" stroke="#9aa7b4" stroke-width="2"/><circle cx="715" cy="157" r="3" fill="#9aa7b4"/><path d="M715,157 L620,157 L620,205" fill="none" stroke="#e06b3b" stroke-width="2" marker-end="url(#s1arr)"/><path d="M715,157 L810,157 L810,205" fill="none" stroke="#4493f8" stroke-width="2" marker-end="url(#s1blue)"/><text x="205" y="340" text-anchor="middle" class="tm" font-size="26">2+2 gates</text><text x="715" y="340" text-anchor="middle" class="ta" font-size="26">3 distinct gates</text></svg></div><p class="cap">Shared ancestors are computed once; every retained gate is charged.</p></section><section class="slide"><h2 class="title">Retained gates still count</h2><div class="figure"><svg viewBox="0 0 920 375" width="920" aria-label="Two paid seed gates t=a+b,u=c+d and two paid completion gates yplus=t+u,yminus=t-u give four additions."><defs><marker id="s2arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#6b7785"/></marker><marker id="s2new" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#e06b3b"/></marker></defs><circle cx="55" cy="120" r="20" fill="#161f2b" stroke="#6b7785"/><text x="55" y="126" text-anchor="middle" class="t eq">a</text><circle cx="55" cy="250" r="20" fill="#161f2b" stroke="#6b7785"/><text x="55" y="256" text-anchor="middle" class="t eq">b</text><circle cx="875" cy="120" r="20" fill="#161f2b" stroke="#6b7785"/><text x="875" y="126" text-anchor="middle" class="t eq">c</text><circle cx="875" cy="250" r="20" fill="#161f2b" stroke="#6b7785"/><text x="875" y="256" text-anchor="middle" class="t eq">d</text><g transform="translate(120,155)"><rect width="170" height="64" rx="10" fill="#10151c" stroke="#9aa7b4" stroke-width="2"/><text x="85.0" y="38" text-anchor="middle" class="t eq">t=a+b</text></g><g transform="translate(630,155)"><rect width="170" height="64" rx="10" fill="#10151c" stroke="#9aa7b4" stroke-width="2"/><text x="85.0" y="38" text-anchor="middle" class="t eq">u=c+d</text></g><g transform="translate(367,25)"><rect width="185" height="64" rx="10" fill="#10151c" stroke="#e06b3b" stroke-width="2"/><text x="92.5" y="38" text-anchor="middle" class="t eq">y₊=t+u</text></g><g transform="translate(367,295)"><rect width="185" height="64" rx="10" fill="#10151c" stroke="#e06b3b" stroke-width="2"/><text x="92.5" y="38" text-anchor="middle" class="t eq">y₋=t−u</text></g><path d="M75,120 L95,120 L120,174" fill="none" stroke="#6b7785" stroke-width="2" marker-end="url(#s2arr)"/><path d="M75,250 L95,250 L120,203" fill="none" stroke="#6b7785" stroke-width="2" marker-end="url(#s2arr)"/><path d="M855,120 L825,120 L800,174" fill="none" stroke="#6b7785" stroke-width="2" marker-end="url(#s2arr)"/><path d="M855,250 L825,250 L800,203" fill="none" stroke="#6b7785" stroke-width="2" marker-end="url(#s2arr)"/><path d="M290,175 L325,115 L367,57" fill="none" stroke="#e06b3b" stroke-width="2" marker-end="url(#s2new)"/><path d="M290,199 L325,260 L367,327" fill="none" stroke="#e06b3b" stroke-width="2" marker-end="url(#s2new)"/><path d="M630,175 L595,115 L552,57" fill="none" stroke="#e06b3b" stroke-width="2" marker-end="url(#s2new)"/><path d="M630,199 L595,260 L552,327" fill="none" stroke="#e06b3b" stroke-width="2" marker-end="url(#s2new)"/></svg></div><p class="cap">2 initial additions + 2 completion additions = 4 additions.</p></section><section class="slide"><h2 class="title">Complete, pool, and verify</h2><div class="figure"><svg viewBox="0 0 920 330" width="920" aria-label="A mixed partial computation enters LEO completion, which can discover new forms outside the old pool. Results enter a pooled-form selection and exact check, then seed later runs."><defs><marker id="s3arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#e06b3b"/></marker><marker id="s3back" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#3a8f82"/></marker></defs><g transform="translate(20,75)"><rect width="170" height="120" rx="12" fill="#10151c" stroke="#e06b3b" stroke-width="2"/><text x="85" y="34" text-anchor="middle" class="t" font-size="18">Mixed partial</text><rect x="32" y="57" width="50" height="16" rx="3" fill="#e06b3b"/><rect x="89" y="57" width="50" height="16" rx="3" fill="#4493f8"/><rect x="62" y="86" width="46" height="12" rx="3" fill="#6b7785"/></g><g transform="translate(255,75)"><rect width="170" height="120" rx="12" fill="#10151c" stroke="#4493f8" stroke-width="2"/><text x="85" y="34" text-anchor="middle" class="t" font-size="18">LEO completion</text><circle cx="65" cy="79" r="8" fill="#6b7785"/><circle cx="95" cy="79" r="8" fill="#6b7785"/><circle cx="125" cy="79" r="8" fill="#e06b3b"/><path d="M34,79 H52" stroke="#e06b3b" stroke-width="2"/></g><g transform="translate(490,75)"><rect width="170" height="120" rx="12" fill="#161f2b" stroke="#6b7785" stroke-width="2"/><text x="85" y="34" text-anchor="middle" class="t" font-size="18">Pool and search</text><circle cx="45" cy="73" r="7" fill="#4493f8"/><circle cx="70" cy="73" r="7" fill="#6b7785"/><circle cx="95" cy="73" r="7" fill="#e06b3b"/><circle cx="120" cy="73" r="7" fill="#4493f8"/><circle cx="70" cy="96" r="7" fill="#e06b3b"/><circle cx="95" cy="96" r="7" fill="#6b7785"/></g><g transform="translate(725,75)"><rect width="170" height="120" rx="12" fill="#10151c" stroke="#3a8f82" stroke-width="2"/><text x="85" y="34" text-anchor="middle" class="t" font-size="18">Exact check</text><path d="M56,74 L76,92 L111,59" fill="none" stroke="#5bb7a8" stroke-width="5"/></g><path d="M190,135 L255,135" fill="none" stroke="#e06b3b" stroke-width="2" marker-end="url(#s3arr)"/><path d="M425,135 L490,135" fill="none" stroke="#e06b3b" stroke-width="2" marker-end="url(#s3arr)"/><path d="M660,135 L725,135" fill="none" stroke="#e06b3b" stroke-width="2" marker-end="url(#s3arr)"/><path d="M810,195 L810,280 L105,280 L105,195" fill="none" stroke="#3a8f82" stroke-width="2" marker-end="url(#s3back)"/></svg></div><p class="cap">Completion can invent forms; improvement is not guaranteed.</p></section></div><script>
(function(){
  function Deck(){
    this.deck=document.querySelector('.deck');this.slides=[].slice.call(document.querySelectorAll('.slide'));
    this.total=this.slides.length;this.current=0;this._chrome();this._bind();this._observe();this._update();
  }
  Deck.prototype._chrome=function(){
    var self=this,b=document.createElement('div');b.className='deck-progress';document.body.appendChild(b);this.bar=b;
    var d=document.createElement('div');d.className='deck-dots';
    this.slides.forEach(function(_,i){var x=document.createElement('button');x.className='deck-dot';x.title='Slide '+(i+1);x.onclick=function(){self.go(i);};d.appendChild(x);});
    document.body.appendChild(d);this.dots=[].slice.call(d.children);
    var c=document.createElement('div');c.className='deck-counter';document.body.appendChild(c);this.counter=c;
    var h=document.createElement('div');h.className='deck-hints';h.textContent='← → / scroll';document.body.appendChild(h);this.hints=h;
    this.ht=setTimeout(function(){h.classList.add('faded');},4000);
  };
  Deck.prototype._bind=function(){
    var self=this;
    document.addEventListener('keydown',function(e){
      if(e.target.closest('input,textarea,[contenteditable]'))return;
      if(['ArrowDown','ArrowRight',' ','PageDown'].indexOf(e.key)>-1){e.preventDefault();self.next();}
      else if(['ArrowUp','ArrowLeft','PageUp'].indexOf(e.key)>-1){e.preventDefault();self.prev();}
      else if(e.key==='Home'){e.preventDefault();self.go(0);}
      else if(e.key==='End'){e.preventDefault();self.go(self.total-1);}
      self._fade();
    });
    var ty;this.deck.addEventListener('touchstart',function(e){ty=e.touches[0].clientY;},{passive:true});
    this.deck.addEventListener('touchend',function(e){var dy=ty-e.changedTouches[0].clientY;if(Math.abs(dy)>50){dy>0?self.next():self.prev();}});
  };
  Deck.prototype._observe=function(){
    var self=this,o=new IntersectionObserver(function(es){es.forEach(function(en){if(en.isIntersecting){en.target.classList.add('visible');self.current=self.slides.indexOf(en.target);self._update();}else{en.target.classList.remove('visible');}});},{threshold:0.5});
    this.slides.forEach(function(s){o.observe(s);});
  };
  Deck.prototype.go=function(i){this.slides[Math.max(0,Math.min(i,this.total-1))].scrollIntoView({behavior:'smooth'});};
  Deck.prototype.next=function(){if(this.current<this.total-1)this.go(this.current+1);};
  Deck.prototype.prev=function(){if(this.current>0)this.go(this.current-1);};
  Deck.prototype._update=function(){
    this.bar.style.width=((this.current+1)/this.total*100)+'%';
    var c=this.current;this.dots.forEach(function(d,i){d.classList.toggle('active',i===c);});
    this.counter.textContent=(this.current+1)+' / '+this.total;
  };
  Deck.prototype._fade=function(){clearTimeout(this.ht);this.hints.classList.add('faded');};
  new Deck();
})();
</script>
</body>
</html>
